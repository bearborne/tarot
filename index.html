<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bearcana</title>

  <!-- Makes it open full screen, like an app, from the iPhone Home Screen -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Bearcana">
  <meta name="theme-color" content="#15131c">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" href="icon-512.png">
  <link rel="manifest" href="manifest.json">

  <!-- Literata: a serif made for reading on screens, used for the summary text -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Literata:opsz,wght@7..72,400;7..72,500&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 1. Choose a spread -->
  <section class="screen" id="home">
    <canvas class="sky" id="sky" aria-hidden="true"></canvas>
    <header class="home-head">
      <!-- Scorpius, over the name: its claws on the right, Antares at its heart, the tail curling up on the left -->
      <svg class="bear-stars" viewBox="-4 -4 158 55" aria-hidden="true">
        <polyline class="bear-line" points="150.0,0.0 132.9,4.4 109.5,7.0 89.6,11.5 71.9,18.0 57.9,27.7 45.3,38.8 32.6,47.1 18.4,40.9 5.2,26.3 0.0,7.2 18.3,0.0 22.3,10.2"/>
        <polyline class="bear-line" points="142.0,19.2 109.5,7.0"/>
        <polyline class="bear-line" points="134.3,30.7 109.5,7.0"/>
        <circle cx="150.0" cy="0.0" r="1.8" style="animation-delay:-0.00s"/><circle cx="132.9" cy="4.4" r="1.4" style="animation-delay:-0.53s"/><circle cx="142.0" cy="19.2" r="1.7" style="animation-delay:-1.06s"/><circle cx="134.3" cy="30.7" r="1.6" style="animation-delay:-1.59s"/><circle cx="109.5" cy="7.0" r="2.3" class="heart" style="animation-delay:-2.12s"/><circle cx="89.6" cy="11.5" r="1.7" style="animation-delay:-2.65s"/><circle cx="71.9" cy="18.0" r="1.4" style="animation-delay:-3.18s"/><circle cx="57.9" cy="27.7" r="1.4" style="animation-delay:-0.31s"/><circle cx="45.3" cy="38.8" r="1.4" style="animation-delay:-0.84s"/><circle cx="32.6" cy="47.1" r="1.8" style="animation-delay:-1.37s"/><circle cx="18.4" cy="40.9" r="1.4" style="animation-delay:-1.90s"/><circle cx="5.2" cy="26.3" r="1.4" style="animation-delay:-2.43s"/><circle cx="0.0" cy="7.2" r="1.8" style="animation-delay:-2.96s"/><circle cx="18.3" cy="0.0" r="1.9" style="animation-delay:-0.09s"/><circle cx="22.3" cy="10.2" r="1.4" style="animation-delay:-0.62s"/>
      </svg>
      <h1>Bearcana</h1>
      <div class="title-star" aria-hidden="true"><i></i><svg viewBox="0 0 14 14"><path d="M7 1 L8.4 5.6 L13 7 L8.4 8.4 L7 13 L5.6 8.4 L1 7 L5.6 5.6Z"/></svg><i></i></div>
    </header>
    <div class="float-deck" id="floatDeck"></div>
    <button class="cotd" id="cotd">Reveal card of the day</button>
    <p class="home-sub">Choose a spread</p>
    <div class="spread-list" id="spreadList"></div>
    <div class="home-links">
      <button class="pill" id="browseBtn">Browse the cards</button>
      <button class="pill" id="historyBtn">Your history</button>
      <button class="pill sky-link" id="skyBtn">✦ Sky now</button>
    </div>
    <button class="link small gold home-nudge" id="homeNudge" hidden>Back up your readings</button>
    <div class="options" id="options"></div>
  </section>

  <!-- 2. The table: shuffle, pick, turn -->
  <section class="screen" id="table" hidden>
    <canvas class="magic" id="magic" aria-hidden="true"></canvas>
    <canvas class="magic frames" id="frames" aria-hidden="true"></canvas>
    <header class="bar">
      <button class="link" id="backBtn">‹ Spreads</button>
      <button class="theme-btn" id="themeBtn" aria-haspopup="dialog">✦ Add a theme</button>
      <span class="bar-space"></span>
    </header>
    <div class="slots-wrap"><div class="slots" id="slots"></div></div>
    <p class="hint" id="hint"></p>
    <div class="deck-area" id="deckArea">
      <div class="deck" id="deck" role="button" aria-label="Spread the cards"></div>
      <div class="fan" id="fan"></div>
      <div class="end-actions" id="endActions" hidden>
        <button class="reading-title" id="readingTitle"></button>
        <button class="pill summary-btn" id="summaryBtn">✦ Reading summary</button>
        <button class="pill" id="newBtn">New reading</button>
      </div>
    </div>
  </section>

  <!-- 3. The card window -->
  <div class="overlay" id="quick" hidden>
    <div class="quick-box" id="quickBox">
      <div class="quick-card" id="quickCard"></div>
      <p class="pos-label" id="quickPos"></p>
      <p class="pos-question" id="quickQuestion"></p>
      <h2 id="quickName"></h2>
      <p class="reversed-note" id="quickReversed" hidden>Reversed</p>
      <p class="keywords" id="quickKeywords"></p>
      <div class="quick-text" id="quickText"></div>
      <div class="asks" id="quickAsks"></div>
      <button class="pill" id="moreBtn">More about this card</button>
      <button class="link" id="quickClose">Close</button>
    </div>
  </div>

  <!-- 4. The details window is built by app.js each time it opens -->

  <!-- 5. Browse the cards -->
  <div class="sheet" id="browse" hidden>
    <header class="bar">
      <button class="link" id="browseBack">‹ Back</button>
      <span class="bar-title">The cards</span>
      <span class="bar-space"></span>
    </header>
    <div class="browse-body">
      <div id="browseFilters">
        <div class="hist-search">
          <input type="search" id="browseSearch" placeholder="Search by name, word, sign or element"
            aria-label="Search the cards" autocomplete="off" spellcheck="false">
          <button class="link small" id="browseSearchClear" aria-label="Clear the search" hidden>×</button>
        </div>
        <div class="chips" id="suitChips"></div>
      </div>
      <div class="grid" id="grid"></div>
    </div>
  </div>

  <!-- 6. Your history: past readings, and backups -->
  <div class="sheet" id="history" hidden>
    <header class="bar">
      <button class="link" id="historyBack">‹ Back</button>
      <span class="bar-title">Your history</span>
      <span class="bar-space"></span>
    </header>
    <div class="history-body">
      <!-- One quiet line about backups; "Back up" opens the ways to do it. -->
      <p class="history-note backup-line">
        <span id="backupText">Saved on this device only</span> ·
        <button class="link small gold" id="backupToggle" aria-expanded="false" aria-controls="backupPanel">Back up</button>
      </p>
      <div class="backup-panel" id="backupPanel" hidden>
        <div class="backup-row">
          <span class="backup-ask">Back up to</span>
          <button class="chip" id="exportBtn">This device</button>
          <button class="chip" id="driveBackupBtn">Google Drive</button>
        </div>
        <div class="backup-row">
          <span class="backup-ask">Restore from</span>
          <button class="chip" id="importBtn">A file</button>
          <button class="chip" id="driveRestoreBtn">Google Drive</button>
        </div>
        <div class="backup-row" id="clearRow">
          <span class="backup-ask">Start over</span>
          <button class="chip danger" id="clearHistBtn">Clear history</button>
        </div>
        <input type="file" id="importFile" accept=".json,application/json" hidden>
        <p class="drive-status" id="driveStatus" hidden></p>
      </div>
      <div class="chips hist-tabs" id="histTabs">
        <button class="chip on" data-mode="readings" aria-pressed="true">Readings</button>
        <button class="chip" data-mode="cotd" aria-pressed="false">Card of the day</button>
        <button class="chip" data-mode="patterns" aria-pressed="false">Patterns</button>
      </div>
      <div class="hist-search" id="histSearchWrap">
        <input type="search" id="histSearch" placeholder="Search by name, card or date"
          aria-label="Search your history" autocomplete="off" spellcheck="false">
        <button class="link small" id="histSearchClear" aria-label="Clear the search" hidden>×</button>
      </div>
      <div id="historyList"></div>
    </div>
  </div>

  <!-- 6a. Clearing the history: choose what goes, then confirm -->
  <div class="overlay" id="clearAsk" hidden role="dialog" aria-modal="true" aria-labelledby="clearTitle">
    <div class="quick-box clear-box">
      <h2 id="clearTitle">Clear history</h2>
      <p class="clear-ask">Choose what to delete</p>
      <div class="clear-picks" id="clearPicks">
        <button class="chip" data-kind="readings" aria-pressed="false"></button>
        <button class="chip" data-kind="cotd" aria-pressed="false"></button>
      </div>
      <p class="clear-warn" id="clearWarn"></p>
      <p class="clear-backup" id="clearBackup"></p>
      <div class="clear-btns">
        <button class="pill small" id="clearCancel">Keep</button>
        <button class="pill small danger" id="clearGo">Delete</button>
      </div>
    </div>
  </div>

  <!-- 6b. Themes: questions laid over the spread's card places -->
  <div class="sheet" id="themed" hidden>
    <header class="bar">
      <button class="link" id="themedBack">‹ Back</button>
      <span class="bar-title" id="themedTitle">Themes</span>
      <span class="bar-space"></span>
    </header>
    <div class="history-body">
      <p class="history-note themed-lead" id="topicNote"></p>
      <button class="pill small theme-none" id="themeNone" hidden>No theme</button>
      <div id="themedList"></div>
    </div>
  </div>

  <!-- 6d. Making or changing a theme of your own -->
  <div class="sheet" id="ownTheme" hidden>
    <header class="bar">
      <button class="link" id="ownBack">‹ Back</button>
      <span class="bar-title" id="ownTitle">New theme</span>
      <span class="bar-space"></span>
    </header>
    <form class="history-body own-form" id="ownForm" autocomplete="off"></form>
  </div>

  <!-- 7. Sky now: the planets this moment -->
  <div class="sheet" id="skySheet" hidden>
    <canvas class="sky sky-stars" id="skyStars" aria-hidden="true"></canvas>
    <header class="bar">
      <button class="link" id="skyBack">‹ Back</button>
      <span class="bar-title">Sky now</span>
      <span class="bar-space"></span>
    </header>
    <div class="history-body sky-body" id="skyBody"></div>
  </div>

  <script src="cloud.js"></script>
  <script src="cards.js"></script>
  <script src="symbols.js"></script>
  <script src="spreads.js"></script>
  <script src="pickfx.js"></script>
  <script src="astronomy.js"></script>
  <!-- How the app works, in this order. You normally only need to edit cards.js and spreads.js. -->
  <script src="js/core.js"></script>
  <script src="js/home.js"></script>
  <script src="js/table.js"></script>
  <script src="js/table-magic.js"></script>
  <script src="js/arcane-circle.js"></script>
  <script src="js/rune-ring.js"></script>
  <script src="js/summary.js"></script>
  <script src="js/portal.js"></script>
  <script src="js/card-pages.js"></script>
  <script src="js/browse.js"></script>
  <script src="js/sky.js"></script>
  <script src="js/history.js"></script>
  <script src="js/drive.js"></script>
  <script src="js/reading-notes.js"></script>
  <script src="js/patterns.js"></script>
  <script src="js/own-themes.js"></script>
  <script src="js/share.js"></script>
  <script src="js/warm-up.js"></script>
</body>
</html>
